<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#0f1419">
	<title>FWMS RF</title>
	<link rel="manifest" href="/api/method/fwms.api.pwa.manifest">
	<link rel="stylesheet" href="/assets/fwms/rf/css/rf.css">
</head>
<body>
	<div id="app">
		<div class="boot">Loading FWMS RF…</div>
	</div>
	<audio id="beep-ok" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>
	<script>
		// beep via WebAudio (no asset dependency)
		function beep(freq = 880, ms = 90) {
			try {
				const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
				const osc = ctx.createOscillator();
				const gain = ctx.createGain();
				osc.frequency.value = freq; osc.connect(gain); gain.connect(ctx.destination);
				gain.gain.setValueAtTime(0.15, ctx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + ms / 1000);
				osc.start(); osc.stop(ctx.currentTime + ms / 1000);
			} catch (e) { /* audio blocked until first gesture */ }
		}
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/api/method/fwms.api.pwa.service_worker', { scope: '/rf' }).catch(() => {});
		}
	</script>
	<script src="/assets/fwms/rf/js/app.js" type="module"></script>
</body>
</html>
